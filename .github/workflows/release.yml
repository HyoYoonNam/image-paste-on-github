name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/cloudflare/package-lock.json

      - name: Check release metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, accessSync } from 'node:fs';
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const version = process.env.GITHUB_REF_NAME;
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const manifest = read('manifest.json');
          assert.equal(manifest.version, version);
          assert.equal(read('package.json').version, version);
          assert.equal(read('package-lock.json').version, version);
          assert.equal(read('versions.json')[version], manifest.minAppVersion);
          accessSync('docs/releases/' + version + '.md');
          NODE

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix relay/cloudflare --ignore-scripts --no-audit --no-fund

      - name: Test plugin and authentication relay
        run: |
          npm test
          npm run test:cloudflare

      - name: Build and test release assets
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:browser

      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
          create-storage-record: false

      - name: Verify attestations before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
